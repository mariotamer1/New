<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGM Painting | Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161a; --bg-raised:#1b1e23; --ink:#f3efe4; --ink-dim:#a8a49a; --ink-faint:#726f68;
    --line:rgba(243,239,228,0.11); --line-strong:rgba(243,239,228,0.22);
    --ochre:#c68a3e; --ochre-light:#e0a862; --sage-light:#8ea27e;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  h1,h2{font-family:'Fraunces',Georgia,serif; font-weight:600;}

  /* ---------- login screen ---------- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:380px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg-raised); padding:clamp(28px,4vw,40px);
  }
  .login-card .logo{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
  .login-card .logo img{height:44px; border-radius:4px;}
  .login-card h1{font-size:22px; margin-bottom:6px;}
  .login-card p{color:var(--ink-dim); font-size:14px; margin-bottom:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; color:var(--ink-faint); margin-bottom:7px;}
  .field input{
    width:100%; background:var(--bg); border:1px solid var(--line-strong); border-radius:3px;
    padding:12px 13px; color:var(--ink); font-size:15px; font-family:inherit;
  }
  .field input:focus-visible{outline:2px solid var(--ochre-light); outline-offset:2px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    padding:13px 20px; font-size:14.5px; font-weight:600; border-radius:3px; border:none;
    background:var(--ochre-light); color:#191305; transition:background .2s var(--ease), transform .2s var(--ease);
    margin-top:6px;
  }
  .btn:hover{background:#e8b877; transform:translateY(-1px);}
  .btn:disabled{opacity:.6; cursor:default; transform:none;}
  .error-msg{
    display:none; color:#e07a7a; font-size:13.5px; margin-top:14px; padding:10px 12px;
    background:rgba(224,122,122,0.08); border:1px solid rgba(224,122,122,0.3); border-radius:3px;
  }
  .error-msg.show{display:block;}

  /* ---------- dashboard ---------- */
  #dashboard{display:none;}
  #dashboard.show{display:block;}
  header.admin-nav{
    position:sticky; top:0; z-index:10; background:rgba(20,22,26,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:16px 0;
  }
  .admin-nav-inner{
    max-width:920px; margin:0 auto; padding:0 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .admin-nav-inner .logo{display:flex; align-items:center; gap:10px;}
  .admin-nav-inner .logo img{height:34px; border-radius:3px;}
  .admin-nav-inner .logo span{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .logout-btn{
    background:none; border:1px solid var(--line-strong); color:var(--ink-dim);
    padding:8px 16px; border-radius:3px; font-size:13.5px; transition:all .2s var(--ease);
  }
  .logout-btn:hover{border-color:var(--ink); color:var(--ink);}

  .wrap{max-width:920px; margin:0 auto; padding:40px 20px 90px;}
  .board-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:28px; flex-wrap:wrap;}
  .board-head h2{font-size:26px;}
  .board-head .count{color:var(--ink-faint); font-size:14px;}
  .filter-row{display:flex; gap:8px; margin-bottom:26px;}
  .filter-btn{
    padding:8px 16px; border:1px solid var(--line-strong); border-radius:99px;
    background:transparent; color:var(--ink-dim); font-size:13px; transition:all .2s var(--ease);
  }
  .filter-btn.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--ink-faint); font-size:14.5px;
    border:1px dashed var(--line-strong); border-radius:6px;
  }

  .req-card{
    border:1px solid var(--line); border-radius:6px; background:var(--bg-raised);
    padding:24px; margin-bottom:16px;
  }
  .req-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .req-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .req-date{color:var(--ink-faint); font-size:12.5px; margin-top:3px;}
  .status-pill{
    font-size:11.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    padding:5px 11px; border-radius:99px; border:1px solid; white-space:nowrap;
  }
  .status-pill.new{color:var(--ochre-light); border-color:rgba(198,138,62,0.5); background:rgba(198,138,62,0.08);}
  .status-pill.answered{color:var(--sage-light); border-color:rgba(107,125,94,0.5); background:rgba(107,125,94,0.08);}

  .req-contacts{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .contact-link{
    display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink);
    border:1px solid var(--line-strong); border-radius:3px; padding:8px 13px;
    transition:all .2s var(--ease);
  }
  .contact-link:hover{border-color:var(--ochre-light); color:var(--ochre-light);}

  .req-details{margin-top:16px; font-size:14.5px; color:var(--ink-dim); line-height:1.6;}
  .req-details .label{color:var(--ink-faint); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}

  .req-notes{margin-top:18px; padding-top:18px; border-top:1px solid var(--line);}
  .req-notes label{display:block; font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
  .req-notes textarea{
    width:100%; min-height:70px; resize:vertical; background:var(--bg); border:1px solid var(--line-strong);
    border-radius:3px; padding:11px 12px; color:var(--ink); font-size:14px; font-family:inherit;
  }
  .req-actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  .save-btn{
    background:var(--ink); color:var(--bg); border:none; padding:9px 18px; border-radius:3px;
    font-size:13.5px; font-weight:600; transition:background .2s var(--ease);
  }
  .save-btn:hover{background:var(--ochre-light); color:#191305;}
  .toggle-btn{
    background:none; border:1px solid var(--line-strong); color:var(--ink-dim);
    padding:9px 16px; border-radius:3px; font-size:13.5px; transition:all .2s var(--ease);
  }
  .toggle-btn:hover{border-color:var(--ink); color:var(--ink);}
  .save-note{font-size:12.5px; color:var(--sage-light); opacity:0; transition:opacity .3s ease;}
  .save-note.show{opacity:1;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><img src="ygm-logo.jpg" alt="YGM Painting"><span style="font-family:'Fraunces',serif; font-weight:600;">YGM Painting</span></div>
    <h1>Admin sign in</h1>
    <p>See and manage every estimate request.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <div class="error-msg" id="loginError"></div>
    </form>
  </div>
</div>

<div id="dashboard">
  <header class="admin-nav">
    <div class="admin-nav-inner">
      <div class="logo"><img src="ygm-logo.jpg" alt="YGM Painting"><span>Requests</span></div>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </header>
  <div class="wrap">
    <div class="board-head">
      <h2>Estimate requests</h2>
      <span class="count" id="reqCount"></span>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="new">New</button>
      <button class="filter-btn" data-filter="answered">Answered</button>
    </div>
    <div id="reqList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  // Fill these in from your Supabase project: Settings -> API
  var SUPABASE_URL = 'https://vbunzkjzwxopwvzhycim.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_F_uqcGExzl8ZFKe9eUm0nQ_SGY8w7g2';

  if(!window.supabase){
    document.body.innerHTML = '<div style="max-width:420px;margin:80px auto;padding:0 20px;font-family:Inter,system-ui,sans-serif;color:#f3efe4;">' +
      '<h1 style="font-family:Fraunces,Georgia,serif;font-size:20px;margin-bottom:10px;">Couldn’t load</h1>' +
      '<p style="color:#a8a49a;font-size:14.5px;line-height:1.6;">The database connection library didn’t load (check your internet connection, or an ad-blocker may be blocking it). Refresh the page to try again.</p>' +
      '</div>';
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var loginScreen = document.getElementById('loginScreen');
  var dashboard = document.getElementById('dashboard');
  var loginForm = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');
  var reqList = document.getElementById('reqList');
  var reqCount = document.getElementById('reqCount');
  var logoutBtn = document.getElementById('logoutBtn');
  var filterBtns = document.querySelectorAll('.filter-btn');

  var allSubmissions = [];
  var currentFilter = 'all';

  function showError(msg){
    loginError.textContent = msg;
    loginError.classList.add('show');
  }

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginError.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      if(res.error){
        showError('Incorrect email or password.');
      }
      /* onAuthStateChange below flips the view once sign-in succeeds */
    });
  });

  logoutBtn.addEventListener('click', function(){
    sb.auth.signOut();
  });

  sb.auth.onAuthStateChange(function(event, session){
    if(session){
      loginScreen.style.display = 'none';
      dashboard.classList.add('show');
      loadSubmissions();
    } else {
      dashboard.classList.remove('show');
      loginScreen.style.display = 'flex';
    }
  });

  function loadSubmissions(){
    reqList.innerHTML = '<div class="empty-state">Loading...</div>';
    sb.from('submissions').select('*').order('created_at', { ascending: false }).then(function(res){
      if(res.error){
        reqList.innerHTML = '<div class="empty-state">Could not load requests: ' + escapeHtml(res.error.message) + '</div>';
        return;
      }
      allSubmissions = res.data || [];
      render();
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) + ' at ' +
             d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    } catch(e){ return iso; }
  }

  function render(){
    var filtered = allSubmissions.filter(function(s){
      if(currentFilter === 'all') return true;
      return (s.status || 'new') === currentFilter;
    });
    reqCount.textContent = allSubmissions.length + ' total';

    if(filtered.length === 0){
      reqList.innerHTML = '<div class="empty-state">No requests here yet.</div>';
      return;
    }

    reqList.innerHTML = filtered.map(function(s){
      var status = s.status || 'new';
      var phoneDigits = (s.phone || '').replace(/[^\d+]/g, '');
      return (
        '<div class="req-card" data-id="' + s.id + '">' +
          '<div class="req-top">' +
            '<div>' +
              '<div class="req-name">' + escapeHtml(s.name || 'No name given') + '</div>' +
              '<div class="req-date">' + fmtDate(s.created_at) + '</div>' +
            '</div>' +
            '<span class="status-pill ' + status + '">' + (status === 'answered' ? 'Answered' : 'New') + '</span>' +
          '</div>' +
          '<div class="req-contacts">' +
            (s.phone ? '<a class="contact-link" href="tel:' + escapeHtml(phoneDigits) + '">Call ' + escapeHtml(s.phone) + '</a>' : '') +
            (s.email ? '<a class="contact-link" href="mailto:' + escapeHtml(s.email) + '">Email ' + escapeHtml(s.email) + '</a>' : '') +
          '</div>' +
          (s.details ? '<div class="req-details"><div class="label">Project details</div>' + escapeHtml(s.details) + '</div>' : '') +
          '<div class="req-notes">' +
            '<label>Your notes / what you told them</label>' +
            '<textarea placeholder="e.g. Called, quoted $2,400, scheduled for next Tuesday">' + escapeHtml(s.reply || '') + '</textarea>' +
            '<div class="req-actions">' +
              '<button class="save-btn" data-action="save">Save note</button>' +
              '<button class="toggle-btn" data-action="toggle">' + (status === 'answered' ? 'Mark as new' : 'Mark as answered') + '</button>' +
              '<span class="save-note">Saved</span>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  reqList.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-action]');
    if(!btn) return;
    var card = e.target.closest('.req-card');
    var id = card.getAttribute('data-id');
    var sub = allSubmissions.find(function(s){ return String(s.id) === id; });
    if(!sub) return;

    if(btn.dataset.action === 'save'){
      var textarea = card.querySelector('textarea');
      var noteEl = card.querySelector('.save-note');
      sb.from('submissions').update({ reply: textarea.value }).eq('id', sub.id).then(function(res){
        if(!res.error){
          sub.reply = textarea.value;
          noteEl.classList.add('show');
          setTimeout(function(){ noteEl.classList.remove('show'); }, 1800);
        }
      });
    }

    if(btn.dataset.action === 'toggle'){
      var newStatus = (sub.status || 'new') === 'answered' ? 'new' : 'answered';
      sb.from('submissions').update({ status: newStatus }).eq('id', sub.id).then(function(res){
        if(!res.error){
          sub.status = newStatus;
          render();
        }
      });
    }
  });

  filterBtns.forEach(function(b){
    b.addEventListener('click', function(){
      filterBtns.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      currentFilter = b.dataset.filter;
      render();
    });
  });
})();
</script>
</body>
</html>
